# CU config for single-machine (CU + DU on same computer)

Active_gNBs = ( "cu-usrp");
Asn1_verbosity = "none";

@include "neighbor-config.conf"

gNBs =
(
 {
    gNB_ID = 0xe00;
    gNB_name  =  "cu-usrp";

    tracking_area_code  =  1;
    plmn_list = ({ mcc = 001; mnc = 01; mnc_length = 2; snssaiList = ({ sst = 1; }) });

    nr_cellid = 12345678L;

    tr_s_preference = "f1";

    # F1 on loopback for same machine (CU .4, DU .3)
    local_s_address     = "192.168.230.95";
    remote_s_address    = "0.0.0.0";
    local_s_portc       = 501;
    local_s_portd       = 2153;
    remote_s_portc      = 500;
    remote_s_portd      = 2154;

    pdcch_ConfigSIB1 = (
      {
        controlResourceSetZero = 12;
        searchSpaceZero = 0;
      }
    );

    SCTP :
    {
        SCTP_INSTREAMS  = 2;
        SCTP_OUTSTREAMS = 2;
    };

    amf_ip_address = ({ ipv4 = "192.168.70.132"; });

    NETWORK_INTERFACES :
    {
        GNB_IPV4_ADDRESS_FOR_NG_AMF  = "192.168.70.129/24";
        GNB_IPV4_ADDRESS_FOR_NGU     = "192.168.70.129/24";
        GNB_PORT_FOR_S1U             = 2152;
    };
  }
);

security = {
  ciphering_algorithms = ( "nea0" );
  integrity_algorithms = ( "nia2", "nia0" );
  drb_ciphering = "yes";
  drb_integrity = "no";
};

log_config : {
  global_log_level = "info";
  pdcp_log_level = "info";
  rrc_log_level = "info";
  f1ap_log_level = "info";
  ngap_log_level = "info";
};

e2_agent = {
  near_ric_ip_addr = "127.0.0.1";
  sm_dir = "/usr/local/lib/flexric/"
};

